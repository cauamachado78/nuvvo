<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nuvvo — criar senha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #ededed;
      padding: 24px;
    }
    .card { width: 100%; max-width: 420px; }
    .logo {
      width: 52px; height: 52px;
      background: #1ed760;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 30px;
      color: #0a0a0a;
      margin-bottom: 24px;
    }
    h1 {
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 34px;
      font-weight: 400;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .sub { font-size: 14px; color: #8a8a8a; margin-bottom: 32px; line-height: 1.5; }
    label { display: block; font-size: 13px; color: #8a8a8a; margin-bottom: 8px; }
    input {
      width: 100%;
      padding: 15px 16px;
      margin-bottom: 16px;
      background: #141414;
      border: 1px solid #242424;
      border-radius: 10px;
      color: #ededed;
      font-size: 15px;
      outline: none;
      transition: border-color .15s;
    }
    input:focus { border-color: #1ed760; }
    button {
      width: 100%;
      padding: 15px;
      background: #1ed760;
      border: none;
      border-radius: 10px;
      color: #0a0a0a;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity .15s;
    }
    button:hover:not(:disabled) { opacity: .9; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    .msg { font-size: 13px; margin-top: 18px; min-height: 20px; line-height: 1.5; }
    .erro { color: #f87171; }
    .ok { color: #1ed760; }
    .loading { color: #8a8a8a; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">w</div>
    <h1>nuvvo</h1>
    <p class="sub">Crie sua senha para acessar o caixa do seu negócio.</p>

    <form id="form">
      <label for="senha">Nova senha</label>
      <input type="password" id="senha" placeholder="Mínimo 8 caracteres" autocomplete="new-password" required>

      <label for="confirma">Confirme a senha</label>
      <input type="password" id="confirma" placeholder="Digite novamente" autocomplete="new-password" required>

      <button type="submit" id="btn">Criar senha</button>
    </form>

    <div class="msg" id="msg"></div>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://flumfzlqtjxsvwhzecdc.supabase.co";
    const SUPABASE_ANON = "sb_publishable_6skOU7S--TL9JhAb9j8rUQ_PLi-lRXE";

    const sb = createClient(SUPABASE_URL, SUPABASE_ANON);
    const form = document.getElementById("form");
    const btn = document.getElementById("btn");
    const msg = document.getElementById("msg");

    const setMsg = (texto, classe) => {
      msg.textContent = texto;
      msg.className = "msg " + (classe || "");
    };

    // Supabase entrega a sessão no hash da URL depois do clique no e-mail
    const { data, error } = await sb.auth.getSession();

    if (error || !data.session) {
      setMsg("Link inválido ou expirado. Peça um novo convite.", "erro");
      btn.disabled = true;
    }

    form.onsubmit = async (e) => {
      e.preventDefault();

      const senha = document.getElementById("senha").value;
      const confirma = document.getElementById("confirma").value;

      if (senha.length < 8) {
        setMsg("A senha precisa ter pelo menos 8 caracteres.", "erro");
        return;
      }
      if (senha !== confirma) {
        setMsg("As senhas não conferem.", "erro");
        return;
      }

      btn.disabled = true;
      setMsg("Salvando...", "loading");

      const { error: erroUpdate } = await sb.auth.updateUser({ password: senha });

      if (erroUpdate) {
        setMsg("Erro: " + erroUpdate.message, "erro");
        btn.disabled = false;
        return;
      }

      setMsg("Senha criada. Entrando...", "ok");
      setTimeout(() => { window.location.href = "https://app.appnuvvo.com.br"; }, 1200);
    };
  </script>
</body>
</html>
